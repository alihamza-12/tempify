name: Tempify CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tempify-production
  cancel-in-progress: false

env:
  NODE_VERSION: "20"

jobs:
  quality:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build production application
        run: npm run build

  deploy:
    name: Deploy to production server
    needs: quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
      SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
      SERVER_SSH_PORT: ${{ vars.SERVER_SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/tempify' }}
      APP_PORT: ${{ vars.APP_PORT || '3001' }}
      PM2_APP_NAME: ${{ vars.PM2_APP_NAME || 'tempify' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SERVER_HOST" || { echo "SERVER_HOST secret is missing"; exit 1; }
          test -n "$SERVER_USER" || { echo "SERVER_USER secret is missing"; exit 1; }
          test -n "$SERVER_SSH_PRIVATE_KEY" || { echo "SERVER_SSH_PRIVATE_KEY secret is missing"; exit 1; }
          test -n "$SERVER_KNOWN_HOSTS" || { echo "SERVER_KNOWN_HOSTS secret is missing"; exit 1; }
          [[ "$SERVER_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "SERVER_SSH_PORT is invalid"; exit 1; }
          [[ "$APP_PORT" =~ ^[0-9]{2,5}$ ]] || { echo "APP_PORT is invalid"; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "DEPLOY_PATH is invalid"; exit 1; }
          [[ "$PM2_APP_NAME" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "PM2_APP_NAME is invalid"; exit 1; }

      - name: Configure deployment SSH key
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Ensure the release directory exists
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$SERVER_SSH_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p '$DEPLOY_PATH'"

      - name: Synchronize application files
        shell: bash
        run: |
          export RSYNC_RSH="ssh -i $HOME/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p $SERVER_SSH_PORT"
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.next/' \
            --exclude='node_modules/' \
            --exclude='coverage/' \
            --exclude='*.tsbuildinfo' \
            --exclude='.env' \
            --exclude='.env.*' \
            ./ "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/"

      - name: Install, build and restart Tempify
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$SERVER_SSH_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "bash -s -- '$DEPLOY_PATH' '$APP_PORT' '$PM2_APP_NAME'" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          DEPLOY_PATH="$1"
          APP_PORT="$2"
          PM2_APP_NAME="$3"

          cd "$DEPLOY_PATH"
          test -f .env.production.local || {
            echo "Missing $DEPLOY_PATH/.env.production.local"
            exit 1
          }
          command -v node >/dev/null || { echo "Node.js is not installed"; exit 1; }
          command -v npm >/dev/null || { echo "npm is not installed"; exit 1; }
          command -v pm2 >/dev/null || { echo "PM2 is not installed"; exit 1; }

          NODE_MAJOR="$(node -p 'Number(process.versions.node.split(".")[0])')"
          test "$NODE_MAJOR" -ge 20 || { echo "Node.js 20 or newer is required"; exit 1; }

          echo "Cleaning previous build artifacts and fixing permissions (EACCES fix)..."
          # Previous .next may be owned by root if manual deploy was done as root
          # This caused: Error: EACCES: permission denied, unlink '/var/www/tempify/.next/.../_not-found.html'
          if [ -d .next ]; then
            echo "Found existing .next, removing..."
            rm -rf .next 2>/dev/null || {
              echo ".next owned by different user, trying sudo chown + rm..."
              sudo chown -R $(whoami):$(whoami) "$DEPLOY_PATH" 2>/dev/null || true
              sudo rm -rf "$DEPLOY_PATH/.next" 2>/dev/null || true
              rm -rf .next 2>/dev/null || true
            }
          fi
          # Extra safety: ensure no stale cache remains
          rm -rf .next 2>/dev/null || true
          # Ensure deploy path is writable by current user
          chmod -R u+rwX "$DEPLOY_PATH" 2>/dev/null || {
            sudo chown -R $(whoami):$(whoami) "$DEPLOY_PATH" 2>/dev/null || true
            chmod -R u+rwX "$DEPLOY_PATH" 2>/dev/null || true
          }
          echo "Clean done, starting install..."

          npm ci
          npm run build

          APP_PORT="$APP_PORT" \
          PM2_APP_NAME="$PM2_APP_NAME" \
          DEPLOY_PATH="$DEPLOY_PATH" \
            pm2 startOrReload deploy/ecosystem.config.cjs --update-env
          pm2 save

          for attempt in {1..20}; do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:$APP_PORT/api/auth/session" >/dev/null; then
              echo "Tempify health check passed on port $APP_PORT"
              exit 0
            fi
            sleep 3
          done

          pm2 logs "$PM2_APP_NAME" --lines 100 --nostream || true
          echo "Tempify health check failed"
          exit 1
          REMOTE_SCRIPT
